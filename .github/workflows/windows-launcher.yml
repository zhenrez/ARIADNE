name: Windows one-click launcher verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-launcher:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.11']
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise isolated one-click bootstrap and server smoke test
        shell: powershell
        run: .\scripts\start-windows.ps1 -VerifyOnly -RequiredPythonMinor '${{ matrix.python }}'
